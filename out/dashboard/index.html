<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar — the next launch, ranked by the snapshot's own figures</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="brand-name">TOKEN RADAR</span></div>
    <div class="top-meta" id="top-meta"></div>
  </header>

  <section class="lede">
    <div>
      <h1>The next launch, ranked by the snapshot's own figures</h1>
      <p id="lede-text"></p>
      <p class="note" id="record-note"></p>
    </div>
    <dl class="facts" id="facts"></dl>
  </section>

  <section class="model" aria-labelledby="model-heading">
    <h2 id="model-heading">How the value is worked out</h2>
    <p class="model-formula" id="model-formula"></p>
    <p id="model-explain"></p>
    <h3>Category multiples, from the live protocols in this snapshot</h3>
    <p class="model-cal-note" id="cal-note"></p>
    <div class="cal-wrap"><table class="cal" id="cal-table">
      <thead><tr><th>Category</th><th>Live comparables</th><th>Median mcap / TVL</th><th>Multiple used</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <p class="model-excl" id="model-excl"></p>
  </section>

  <section class="controls" aria-label="Board controls">
    <label class="search"><span class="visually-hidden">Search protocols</span><input id="q" type="search" placeholder="Search a protocol…" autocomplete="off"></label>
    <label>Category <select id="category"><option value="">All categories</option></select></label>
    <label>Chain <select id="chain"><option value="">All chains</option></select></label>
    <label class="check"><input id="watchlist-only" type="checkbox"> Watchlist only</label>
    <div class="tabs" role="tablist" aria-label="Board view">
      <button id="tab-early" role="tab" aria-selected="true">Pre-token</button>
      <button id="tab-live" role="tab" aria-selected="false">Live tokens</button>
    </div>
  </section>

  <p class="count" id="count" aria-live="polite"></p>

  <main>
    <table class="board" id="board">
      <thead>
        <tr>
          <th><button class="sort" data-sort="rank">Rank</button></th>
          <th><button class="sort" data-sort="name">Protocol</button></th>
          <th><button class="sort" data-sort="category">Category</button></th>
          <th><button class="sort" data-sort="chains">Chains</button></th>
          <th class="num"><button class="sort" data-sort="tvl_usd">TVL</button></th>
          <th class="num"><button class="sort" data-sort="change_7d">7d</button></th>
          <th class="num"><button class="sort" data-sort="age_days">Age</button></th>
          <th class="num"><button class="sort" data-sort="implied_usd">Implied value</button></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No protocol matches. Clear the search or a filter.</p>
  </main>

  <dialog class="detail" id="detail" aria-labelledby="detail-title">
    <div class="detail-head">
      <h2 id="detail-title"></h2>
      <button class="close" id="detail-close" aria-label="Close detail">×</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </dialog>

  <footer class="foot">
    <p id="foot-note"></p>
  </footer>
</div>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
